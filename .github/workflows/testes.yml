name: Testes Boleto Fácil

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "feat/**"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
